<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Cliente</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f5f5f5;
        }
        h1 { color: #dc3545; /* Rojo para indicar peligro */ }

        .confirm-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }

        p { font-size: 1.1em; color: #333; }

        button {
            margin-top: 15px;
            padding: 10px;
            width: 100%;
            border: none;
            cursor: pointer;
            background: #dc3545; /* Rojo */
            color: white;
            border-radius: 5px;
            font-size: 1rem;
        }
        button:hover { background: #c82333; }

        .btn-cancel {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #666;
        }
    </style>
</head>
<body>

    <h1>Eliminar Cliente</h1>

    <div class="confirm-box">
        <p>¿Seguro que deseas eliminar a <strong>{{ client.name }}</strong>?</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit">Sí, eliminar</button>
            <a href="{% url 'clients_list' %}" class="btn-cancel">Cancelar</a>
        </form>
    </div>

</body>
</html>
