<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ action }} Servicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-custom { background-color: #2c3e50; }
        .form-container { max-width: 500px; margin: 50px auto; }
        .btn-submit { background-color: #27ae60; border: none; }
        .btn-submit:hover { background-color: #229954; }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark navbar-custom">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">🔧 Sistema de Servicios</span>
        </div>
    </nav>

    <div class="container form-container">
        <!-- Mensajes -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <div class="card shadow-lg">
            <div class="card-body">
                <h3 class="card-title mb-4">{{ action }} Servicio</h3>

                <form method="POST" novalidate>
                    {% csrf_token %}

                    <!-- Nombre -->
                    <div class="mb-3">
                        <label for="name" class="form-label">
                            <strong>Nombre del Servicio *</strong>
                        </label>
                        <input type="text" 
                               class="form-control" 
                               id="name" 
                               name="name"
                               value="{% if servicio %}{{ servicio.name }}{% endif %}"
                               placeholder="Ej: Cambio de aceite"
                               required>
                        <small class="form-text text-muted">Campo obligatorio</small>
                    </div>

                    <!-- Descripción -->
                    <div class="mb-3">
                        <label for="descripcion" class="form-label">
                           <strong>Descripción</strong>
                        </label>
                        <textarea class="form-control" id="descripcion" name="descripcion" rows="3"
                                  placeholder="Descripción breve del servicio">{% if servicio %}{{ servicio.Description }}{% endif %}</textarea>
                        <small class="form-text text-muted">Opcional</small>
                    </div>

                    <!-- Costo -->
                    <div class="mb-3">
                        <label for="costo" class="form-label">
                            <strong>Costo ($) *</strong>
                        </label>
                        <input type="number" 
                               class="form-control" 
                               id="costo" 
                               name="costo"
                               value="{% if servicio %}{{ servicio.costo }}{% endif %}"
                               placeholder="0.00"
                               step="0.01"
                               min="0"
                               required>
                        <small class="form-text text-muted">Debe ser un número positivo</small>
                    </div>

                    <!-- Botones -->
                    <div class="d-grid gap-2 d-md-flex justify-content-md-between">
                        <a href="{% url 'servicios_list' %}" class="btn btn-secondary">
                            ← Cancelar
                        </a>
                        <button type="submit" class="btn btn-submit btn-lg">
                            {% if action == 'Crear' %}✅ Crear Servicio{% else %}💾 Guardar Cambios{% endif %}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Validación cliente antes de enviar
        document.querySelector('form').addEventListener('submit', function(e) {
            const name = document.getElementById('name').value.trim();
            const costo = document.getElementById('costo').value.trim();
            
            if (!name) {
                e.preventDefault();
                alert('⚠️ El nombre del servicio es obligatorio.');
                return false;
            }
            
            if (!costo || parseFloat(costo) < 0) {
                e.preventDefault();
                alert('⚠️ El costo debe ser un número válido y positivo.');
                return false;
            }
        });
    </script>
</body>
</html>
